<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Delivery System - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Drone Delivery System</h1>
            <p>Flight Tracking & Delivery Management Portal</p>
        </header>

        <div id="alert-message" class="alert-box" style="display: none;"></div>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label for="role">Login As</label>
                <select id="role" name="role" required>
                    <option value="CUSTOMER">Customer</option>
                    <option value="VENDOR">Vendor</option>
                </select>
            </div>

            <button type="submit" id="login-btn" class="btn-primary">Sign In</button>
        </form>

        <footer style="margin-top: 1.5rem; text-align: center;">
            <p>Don't have an account? <a href="{{ url_for('register_page') }}">Register Here</a></p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
