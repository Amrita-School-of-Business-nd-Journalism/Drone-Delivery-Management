<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Delivery System - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Create Account</h1>
            <p>Join as a Customer or Vendor</p>
        </header>

        <div id="alert-message" class="alert-box" style="display: none;"></div>

        <form id="register-form" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" maxlength="25" placeholder="First name" required>
                </div>
                
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" maxlength="25" placeholder="Last name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" maxlength="50" placeholder="example@domain.com" required>
            </div>

            <div class="form-group">
                <label for="phone_no">Phone Number (10 Digits)</label>
                <input type="tel" id="phone_no" name="phone_no" maxlength="10" placeholder="10 digit phone number" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="6" placeholder="At least 6 characters" required>
            </div>

            <div class="form-group">
                <label for="role">Account Role</label>
                <select id="role" name="role" required>
                    <option value="CUSTOMER">Customer</option>
                    <option value="VENDOR">Vendor</option>
                </select>
            </div>

            <button type="submit" id="submit-btn" class="btn-primary">Register</button>
        </form>

        <footer style="margin-top: 1.5rem; text-align: center;">
            <p>Already have an account? <a href="{{ url_for('home') }}">Sign In</a></p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
